name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
      - name: Verify the checked evaluation artifact is reproducible
        run: |
          python -m app.evaluation data/sample_interactions.json --catalog data/sample_items.json \
            --diversity both --k 5 --output /tmp/sample-evaluation.json
          diff -u reports/sample-evaluation.json /tmp/sample-evaluation.json

  container-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start the stack
        run: docker compose up --build --detach --wait
      - name: Seed synthetic interactions and verify rerun is safe
        run: |
          docker compose exec -T api python -m scripts.seed_sample_data
          docker compose exec -T api python -m scripts.seed_sample_data
      - name: Exercise the deployed API
        run: python scripts/smoke_test.py --timeout 30
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
